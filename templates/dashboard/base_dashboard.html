{% extends "base/base.html" %}
{% load static %}

{% block main_wrapper %}
<div class="dash-layout">

    <nav class="dash-sidenav" aria-label="Dashboard navigation">
        <div class="dash-sidenav__logo">
            <span class="dash-sidenav__portal-title">Practitioner<br>Portal</span>
            <svg class="dash-sidenav__portal-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 2L3 7l.01 5.15C3.06 17.1 7 21.7 12 23c4.99-1.3 8.93-5.9 8.99-10.85L21 7 12 2z"/>
            </svg>
        </div>

        <ul class="dash-sidenav__links" role="list">
            <li>
                <a href="{% url 'dashboard:dashboard' %}"
                   class="dash-sidenav__link {% block nav_dashboard %}{% endblock %}"
                   aria-label="Dashboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span class="dash-sidenav__label">Dashboard</span>
                </a>
            </li>
            <li>
                <a href="{% url 'dashboard:clients_page' %}"
                   class="dash-sidenav__link {% block nav_clients %}{% endblock %}"
                   aria-label="Clients">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span class="dash-sidenav__label">Clients</span>
                </a>
            </li>
            <li>
                <a href="{% url 'dashboard:notifications_page' %}"
                   class="dash-sidenav__link {% block nav_notifications %}{% endblock %}"
                   aria-label="Notifications">
                    <span class="dash-sidenav__icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                        <span class="dash-notif-badge" id="notifBadge" style="display:none;"></span>
                    </span>
                    <span class="dash-sidenav__label">Notifications</span>
                </a>
            </li>
        </ul>

        <div class="dash-sidenav__bottom">
            <a href="{% url 'accounts:logout' %}" class="dash-sidenav__link dash-sidenav__link--logout" aria-label="Logout">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span class="dash-sidenav__label">Logout</span>
            </a>
        </div>
    </nav>

    <div class="dash-main">
        {% block content %}{% endblock %}
    </div>

</div>

<script>
(function () {
    fetch("{% url 'dashboard:notification_count' %}")
        .then(function (r) { return r.json(); })
        .then(function (data) {
            if (data.count > 0) {
                var badge = document.getElementById('notifBadge');
                if (badge) {
                    badge.textContent = data.count > 99 ? '99+' : data.count;
                    badge.style.display = 'inline-flex';
                }
            }
        })
        .catch(function () {});
})();
</script>
{% endblock %}
