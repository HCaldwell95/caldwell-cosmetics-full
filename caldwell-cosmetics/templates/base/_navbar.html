{% load static %}

<header class="nav-header">
    <div class="nav-container container-fluid">
        <!-- Logo -->
        <a href="/" class="logo-link" aria-label="Home page">
            <img src="{% static 'images/mini-logo.png' %}" alt="Caldwell Cosmetics Logo" class="logo-image">
        </a>

        <!-- Mobile Menu Toggle -->
        <button class="nav-toggle" aria-expanded="false" aria-label="Toggle navigation menu">
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
        </button>

        <!-- Navigation -->
        <nav class="nav-menu">
            <ul class="nav-links">
                {% with url_name=request.resolver_match.url_name %}
                <li class="{% if not url_name or url_name == 'home_details' %}active{% endif %}">
                    <a href="" aria-label="Home">Home</a>
                </li>
                <li class="{% if url_name == 'treatment_details' %}active{% endif %}">
                    <a href="" aria-label="Treatments">Treatments</a>
                </li>
                <li>
                    <a href="" aria-label="Bookings">Bookings</a>
                </li>
                <li>
                    <a href="" aria-label="Sign In / Up">Sign In / Up</a>
                </li>
                <li>
                    <button type="button" class="btn book-btn" style="margin-top: 0px;"
                        onclick="location.href='https://portal.aestheticnursesoftware.com/book-online/8300'" 
                        aria-label="Book Now!">
                        Book Now!
                    </button>
                </li>
                {% endwith %}
            </ul>
        </nav>
    </div>
</header>
