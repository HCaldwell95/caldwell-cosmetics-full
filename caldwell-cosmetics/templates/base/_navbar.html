{% load static %}

<header class="nav-header">
    <div class="nav-container container-fluid">
        <!-- Logo -->
        <a href="/" class="logo-link" aria-label="Home page">
            <img src="{% static 'images/mini-logo.png' %}" alt="Caldwell Cosmetics Logo" class="logo-image">
        </a>

        <!-- Mobile Menu Toggle -->
        <button class="nav-toggle" aria-expanded="false" aria-label="Toggle navigation menu">
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
        </button>

        <!-- Navigation -->
        <nav class="nav-menu">
            <ul class="nav-links">
                {% with url_name=request.resolver_match.url_name %}
                <li class="{% if not url_name or url_name == 'core:home' %}active{% endif %}">
                    <a href="{% url 'core:home' %}" aria-label="Home">Home</a>
                </li>
                <li class="{% if url_name == 'treatments:treatments' %}active{% endif %}">
                    <a href="{% url 'treatments:treatments' %}" aria-label="Treatments">Treatments</a>
                </li>
                <li>
                    <a href="{% url 'bookings:overview' %}" aria-label="Bookings">Bookings</a>
                </li>
                {% if user.is_authenticated %}
                <li class="{% if url_name == 'accounts:profile' %}active{% endif %}">
                    <a href="{% url 'accounts:profile' %}" aria-label="My Profile">My Profile</a>
                </li>
                {% else %}
                <li class="{% if url_name == 'accounts:login' or url_name == 'accounts:register' %}active{% endif %}">
                    <a href="{% url 'accounts:login' %}" aria-label="Sign In / Up">Sign In / Up</a>
                </li>
                {% endif %}
                <li>
                    <button type="button" class="btn book-btn"
                        onclick="location.href='https://portal.aestheticnursesoftware.com/book-online/8300'" 
                        aria-label="Book Now!">
                        Book Now!
                    </button>
                </li>
                {% endwith %}
            </ul>
        </nav>
    </div>
</header>
