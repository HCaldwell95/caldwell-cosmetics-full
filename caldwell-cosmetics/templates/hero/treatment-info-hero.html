<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Importing Google Fonts that match your existing font variables -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- 
      NEW HERO SECTION
      Layout: Split Screen. Left = Content Box. Right = Spanning Image.
    -->
    <section class="hero">

        {% if category.image %}
            <img 
                src="{{ category.image.url }}" 
                class="hero__image"
                alt="{{ category.name }}"
                loading="eager">
            {% endif %}
        
        <!-- LEFT SIDE: Content Box -->
        <div class="hero__image-container">
            <!-- Added a subtle overlay for depth -->
            <div class="hero__image-overlay"></div>
        </div>
        
        <!-- RIGHT SIDE: Spanning Image -->
        <div class="hero__box animate-in">
            
            <!-- Tagline / Est. Date -->
            <p class="hero__tagline">Treatments</p>

            <!-- Main Title -->
            <h1 class="hero__title">
                {{ category.name }}
            </h1>

            <!-- Description -->
            <div class="hero__description">
                {{ category.summary|linebreaks }}
            </div>

            <!-- Call to Action Buttons (Inspired by reference image) -->
            <div class="hero__cta">
                <a href="{% url 'bookings:overview' %}" class="btn">Schedule Appointment</a>
            </div>
        </div>
    </section>
</body>
